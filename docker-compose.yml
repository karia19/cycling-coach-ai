version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: trainer-ai-backend
    restart: unless-stopped
    ports:
      - "8999:8765"
    volumes:
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: ./frontend
      args:
        # When deploying publicly, change this to your backend domain (e.g. https://cycling-api.yourdomain.com)
        - NEXT_PUBLIC_API_URL=https://cycling.oivauix.org
    container_name: trainer-ai-frontend
    restart: unless-stopped
    ports:
      - "3333:3456"
    depends_on:
      - backend
