# FRONT-END & BACK-END: cycling.oivauix.org
server {
    listen 80;
    server_name cycling.oivauix.org;

    # Frontend reititys
    location / {
        proxy_pass http://127.0.0.1:3333;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Web-socket tuki (React/Vite hot reload ja WS-viestit)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend API reititys (kaikki /api/alkavat pyynnöt)
    location /api/ {
        proxy_pass http://127.0.0.1:8999;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Asetetaan riittävän suuri sallittu tiedostokoko (esim. isojen FIT/JSON tiedostojen lataukseen)
        client_max_body_size 50M;
        
        # Web-socket tuki (tarvittaessa backendille)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
